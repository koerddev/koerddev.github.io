    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .fixed-logo {
          position: fixed;
          top: 30px;
          right: 20px;
          z-index: 50;
          pointer-events: none;
          font: 800 44px Arial;
          color: #111;
          text-shadow: -2px -1px #00f2ea, 2px 1px #ff0050;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        img {
            -webkit-user-drag: none;
            user-drag: none;
        }

        #app {
            width: 100%;
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: auto; 
            overscroll-behavior: none;
            -ms-overflow-style: none;  
            scrollbar-width: none;  
        }
        
        #app::-webkit-scrollbar {
            display: none;
        }

        .channel-container {
            width: 100%;
            height: 100vh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            pointer-events: none;
        }

        /* Main UI Wrapper */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: calc(30px + env(safe-area-inset-top)) 20px calc(30px + env(safe-area-inset-bottom));
            background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 20%, transparent 80%, rgba(0,0,0,0.8) 100%);
            z-index: 10;
        }

        .top-ui {
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
        }

        .live-badge {
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(4px);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #ff2a2a;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 42, 42, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(255, 42, 42, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 42, 42, 0); }
        }

        .bottom-ui {
            margin-bottom: 30px;
            width: 75%; 
        }

        .channel-name {
            font-size: 24px;
            font-weight: 700;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            margin-bottom: 4px;
        }

        .channel-category {
            font-size: 14px;
            color: #ccc;
        }

        .right-sidebar {
            position: absolute;
            right: 15px;
            bottom: calc(60px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            pointer-events: auto;
            z-index: 30;
        }

        .channel-logo-link {
            display: block;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #fff;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.2s;
            background: #222;
        }

        .channel-logo-link:hover {
            transform: scale(1.1);
        }

        .channel-logo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .sidebar-btn {
            background: rgba(0,0,0,0.4);
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 20px;
            backdrop-filter: blur(5px);
            transition: all 0.2s;
            color: white;
            border: none;
        }

        .sidebar-btn:hover {
            background: rgba(0,0,0,0.6);
            transform: scale(1.05);
        }

        .sidebar-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .status-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none; 
            flex-direction: column;
            align-items: center;
            z-index: 20;
            text-align: center;
            pointer-events: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .error-message {
            background: rgba(255, 0, 0, 0.8);
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
        }

        .unmute-btn {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.5);
            padding: 12px 24px;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto;
            transition: background 0.2s;
        }

        .unmute-btn:hover { background: rgba(255,255,255,0.3); }

        /* Install / Add-to-Home-Screen modal */
        .install-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            pointer-events: auto;
        }

        .install-modal-content {
            background: #151515;
            border-radius: 16px;
            padding: 28px 24px;
            max-width: 320px;
            width: 85%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .install-modal-content h3 {
            font-size: 18px;
            margin-bottom: 12px;
        }

        .install-modal-content p {
            font-size: 14px;
            color: #ccc;
            line-height: 1.5;
            margin-bottom: 14px;
        }

        .install-modal-content p:empty {
            margin-bottom: 0;
        }

        .install-modal-content ol {
            text-align: left;
            list-style: none;
            counter-reset: step-counter;
            margin-bottom: 22px;
            padding: 0;
        }

        .install-modal-content ol:empty {
            margin-bottom: 0;
        }

        .install-modal-content ol li {
            counter-increment: step-counter;
            font-size: 14px;
            color: #eee;
            line-height: 1.45;
            padding-left: 32px;
            position: relative;
            margin-bottom: 12px;
        }

        .install-modal-content ol li::before {
            content: counter(step-counter);
            position: absolute;
            left: 0;
            top: -1px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: linear-gradient(90deg, #00f2ea, #ff0050);
            color: #000;
            font-weight: bold;
            font-size: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .install-modal-content button {
            background: linear-gradient(90deg, #00f2ea, #ff0050);
            border: none;
            padding: 10px 28px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            color: #000;
            cursor: pointer;
        }

        /* One-time "swipe up" hint for first-time visitors */
        .swipe-hint {
            position: fixed;
            left: 50%;
            bottom: calc(100px + env(safe-area-inset-bottom));
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(6px);
            padding: 12px 20px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            z-index: 60;
            display: none;
            align-items: center;
            gap: 8px;
            pointer-events: none;
            animation: swipe-hint-bounce 1.4s ease-in-out infinite;
        }

        @keyframes swipe-hint-bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-8px); }
        }

    </style>
</head>
<body>

    <div id="app"></div>

    <div class="install-modal" id="install-modal">

    <script>
        // Add `type: "iframe"` on any channel that isn't a direct HLS (.m3u8) stream,
        // e.g. embed pages like ok.ru/videoembed/... . Everything without a `type`
        // is treated as a normal HLS video.
        const uniqueChannels = [
            { id: 0, name: "Med Muzîk", category: "Music", url: "https://m3u8-proxy.koerdnederland.workers.dev/live3.m3u8", logo: "https://www.google.com/s2/favicons?sz=128&domain=medmuzik.tv", website: "http://medmuzik.tv/" },
            { id: 1, name: "StêrkTV", category: "News", url: "https://zindi.sterk.tv/live/sterk.m3u8", logo: "https://www.google.com/s2/favicons?sz=128&domain=sterk.tv", website: "https://sterk.tv" },
            { id: 2, name: "JinTV", category: "By Women for Women, Women-focused Channel", url: "https://live.jintv.org/medialive/jintv.m3u8", logo: "https://www.google.com/s2/favicons?sz=128&domain=jintv.net", website: "https://jintv.net/" },
            { id: 3, name: "RonahiTV", category: "News & Culture", url: "https://hlspackager.akamaized.net/live/DB/RONAHI_TV/HLS/RONAHI_TV.m3u8", logo: "https://www.google.com/s2/favicons?sz=128&domain=ronahi.tv", website: "https://ronahi.tv" },
            { id: 4, name: "Nûçe TV", category: "News & Culture", url: "https://hlspackager.akamaized.net/live/DB/NU_TV/HLS/NU_TV.m3u8", logo: "https://www.google.com/s2/favicons?sz=128&domain=nucetv.net", website: "https://nucetv.net/" },
            { id: 5, name: "Zagros24", category: "Rojhilat & Iran News", url: "https://hlspackager.akamaized.net/live/DB/ZAGROS_24/HLS/ZAGROS_24.m3u8", logo: "https://www.google.com/s2/favicons?sz=128&domain=zagros24.net", website: "https://zagros24.net/" },
            { id: 6, name: "Rojava", category: "Rojava News & Culture", url: "https://hlspackager.akamaized.net/live/DB/ROJAVA_HD/HLS/ROJAVA_HD.m3u8", logo: "https://www.google.com/s2/favicons?sz=128&domain=rojavatv.net", website: "https://rojavatv.net" },
            { id: 7, name: "ÇiraTV", category: "Ezidi News & Culture", type: "iframe", url: "https://ok.ru/videoembed/10267254464101?autoplay=1", logo: "https://www.google.com/s2/favicons?sz=128&domain=ciratv.com", website: "https://ciratv.com/" },
            { id: 8, name: "ZarokTV", category: "Children's Channel", url: "https://zindikurmanci.zaroktv.com.tr/hls/0/stream.m3u8", logo: "https://www.google.com/s2/favicons?sz=128&domain=zaroktv.com.tr", website: "https://zaroktv.com.tr/" },
        ];

        // Lower LOOP_MULTIPLIER = fewer DOM nodes rendered up front (faster
        // first load), at the cost of the infinite-scroll illusion wrapping
        // around sooner. 16 still allows ~70 scrolls in either direction
        // before it loops - plenty for a normal session.
        const LOOP_MULTIPLIER = 16; 
        const TOTAL_RENDER_COUNT = uniqueChannels.length * LOOP_MULTIPLIER;

        // --- Install / Add-to-Home-Screen support ---
        // Chrome/Edge (Windows, macOS, Android, ChromeOS) support a real,
        // native "Install" prompt once a manifest + service worker are
        // registered. iOS Safari and desktop Safari deliberately do NOT
        // allow this to be triggered from JS - Apple requires the user to
        // do it manually, so we detect those cases and show instructions.
        let deferredInstallPrompt = null;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredInstallPrompt = e;
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => {
                console.log('Service worker registration failed:', err);
            });
        }

        function detectPlatform() {
            const ua = navigator.userAgent || navigator.vendor || window.opera || '';
            const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
            const isAndroid = /Android/.test(ua);
            const isWindows = /Windows/.test(ua);
            const isMac = /Macintosh/.test(ua) && !isIOS;
            const isSafari = /^((?!chrome|android|crios|fxios|edgios).)*safari/i.test(ua);
            const isFirefox = /Firefox|FxiOS/.test(ua);
            return { isIOS, isAndroid, isWindows, isMac, isSafari, isFirefox };
        }

        function showInstallInstructions(title, intro, steps) {
            document.getElementById('install-modal-title').textContent = title;
            document.getElementById('install-modal-intro').textContent = intro || '';
            document.getElementById('install-modal-steps').innerHTML =
                (steps || []).map(step => `<li>${step}</li>`).join('');
            document.getElementById('install-modal').style.display = 'flex';
        }

        function closeInstallModal() {
            document.getElementById('install-modal').style.display = 'none';
        }

        async function handleInstallClick(event) {
            if (event) event.stopPropagation();

            // Already installed / running as an installed app - nothing to do.
            if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
                showInstallInstructions("Already Installed", "ZindîTok is already added to your device.", []);
                return;
            }

            if (deferredInstallPrompt) {
                // Real native install prompt - Chrome/Edge on Windows, macOS,
                // Android, or ChromeOS. This is the actual "suiting button":
                // no tutorial needed, the browser handles everything.
                deferredInstallPrompt.prompt();
                await deferredInstallPrompt.userChoice;
                deferredInstallPrompt = null;
                return;
            }

            const { isIOS, isAndroid, isWindows, isMac, isSafari, isFirefox } = detectPlatform();

            if (isIOS) {
                showInstallInstructions(
                    "Add to Home Screen",
                    "iOS doesn't allow apps to trigger this automatically, so it takes a few taps:",
                    [
                        "Tap the <strong>Share</strong> icon in the toolbar (the square with an arrow pointing up).",
                        "Scroll down the share menu and tap <strong>Add to Home Screen</strong>.",
                        "Tap <strong>Add</strong> in the top-right corner."
                    ]
                );
            } else if (isAndroid) {
                showInstallInstructions(
                    "Add to Home Screen",
                    "Your browser didn't offer the one-tap install, but you can still add it manually:",
                    [
                        "Tap the <strong>\u22ee</strong> menu in the top-right corner of your browser.",
                        "Tap <strong>Add to Home screen</strong> (or <strong>Install app</strong>).",
                        "Confirm by tapping <strong>Add</strong> / <strong>Install</strong>."
                    ]
                );
            } else if (isWindows) {
                if (isFirefox) {
                    showInstallInstructions(
                        "Install Not Supported",
                        "Firefox on Windows doesn't support installing sites as apps.",
                        [
                            "Press <strong>Ctrl+D</strong> to bookmark this page instead, or",
                            "Open this site in <strong>Edge</strong> or <strong>Chrome</strong> for a one-click Install option."
                        ]
                    );
                } else {
                    showInstallInstructions(
                        "Install ZindîTok",
                        "Add a desktop shortcut and Start Menu entry in a couple of clicks:",
                        [
                            "Look for the install icon (\u2295 or a small monitor) at the right side of the address bar.",
                            "If you don't see it, open the <strong>\u22ee</strong> or <strong>\u22ef</strong> browser menu and choose <strong>Install ZindîTok</strong> / <strong>Apps \u2192 Install this site as an app</strong>.",
                            "Click <strong>Install</strong> in the confirmation dialog."
                        ]
                    );
                }
            } else if (isMac && isSafari) {
                showInstallInstructions(
                    "Add to Dock",
                    "",
                    [
                        "In the menu bar, choose <strong>File \u2192 Add to Dock</strong> (or tap the Share icon and choose <strong>Add to Dock</strong>).",
                        "Confirm the name and click <strong>Add</strong>."
                    ]
                );
            } else if (isMac && isFirefox) {
                showInstallInstructions(
                    "Install Not Supported",
                    "Firefox on macOS doesn't support installing sites as apps.",
                    [
                        "Press <strong>Cmd+D</strong> to bookmark this page instead, or",
                        "Open this site in <strong>Safari</strong>, <strong>Edge</strong>, or <strong>Chrome</strong> to install it."
                    ]
                );
            } else {
                showInstallInstructions(
                    "Install ZindîTok",
                    "",
                    [
                        "Open your browser's menu (usually <strong>\u22ee</strong> or <strong>\u22ef</strong> near the address bar).",
                        "Look for <strong>Install app</strong> or <strong>Add to Home screen</strong>.",
                        "If neither is available, bookmark this page for quick access instead."
                    ]
                );
            }
        }

        // Deep-linking: if the URL has ?channel=<id>, start on that channel
        // (still placed in the middle loop-block so infinite scroll still works
        // both up and down from the starting point).
        function getInitialIndex() {
            const params = new URLSearchParams(window.location.search);
            const channelId = parseInt(params.get('channel'));
            const middleBlock = Math.floor(LOOP_MULTIPLIER / 2) * uniqueChannels.length;

            if (!isNaN(channelId)) {
                const channelPos = uniqueChannels.findIndex(c => c.id === channelId);
                if (channelPos !== -1) {
                    return middleBlock + channelPos;
                }
            }

            // No share link - always start at the very first channel (the
            // top), rather than resuming wherever the user left off.
            return 0;
        }

        let currentIndex = getInitialIndex();
        let isMuted = localStorage.getItem('zinditok_muted') !== 'false';
        const hlsInstances = new Map();

        const appContainer = document.getElementById('app');

        // Always guarantees the video actually starts playing. Browsers will
        // reliably autoplay muted video, but often silently block unmuted
        // autoplay - especially on mobile, where scrolling to a new video
        // doesn't count as a "user gesture" for audio. If that happens, this
        // falls back to muted playback for THIS video only - it never
        // touches the user's saved sound preference, so it won't keep
        // re-muting on every subsequent scroll.
        function attemptAutoplay(video, index) {
            const pauseIcon = document.getElementById(`pause-${index}`);
            if (pauseIcon) pauseIcon.style.display = 'none';

            video.muted = isMuted;
            video.volume = 1.0;
            const playPromise = video.play();
            if (playPromise !== undefined) {
                playPromise.catch((err) => {
                    // Fast scrolling causes play() to get interrupted by a
                    // pause() call a moment later (the browser throws
                    // AbortError here) - that's not a real autoplay-policy
                    // block, so ignore it entirely rather than force-muting.
                    if (err && err.name === 'AbortError') return;

                    // By the time this fires, the user may have already
                    // scrolled past this channel - don't touch anything on
                    // behalf of a channel that's no longer active.
                    if (index !== currentIndex) return;

                    // A genuine autoplay-with-sound block. Fall back to
                    // muted so playback still starts, but only for this one
                    // video - the saved preference (isMuted / localStorage)
                    // is left untouched so it doesn't spiral into re-muting
                    // every channel for the rest of the session.
                    video.muted = true;
                    video.play().catch(err2 => console.log("Autoplay still blocked:", err2));

                    if (!isMuted) {
                        // Reflect the temporary local mute on just this tile,
                        // without flipping the global preference/icon state.
                        const overlay = document.getElementById(`unmute-overlay-${index}`);
                        if (overlay) overlay.style.display = 'flex';
                        const container = video.closest('.channel-container');
                        const icon = container && container.querySelector('.mute-btn-icon');
                        if (icon) icon.innerHTML = '🔇';
                    }
                });
            }
        }

        function initDOM() {
            for (let i = 0; i < TOTAL_RENDER_COUNT; i++) {
                const channel = uniqueChannels[i % uniqueChannels.length];
                const isIframe = channel.type === 'iframe';
                const container = document.createElement('div');
                container.className = 'channel-container';
                container.id = `container-${i}`;
                
                container.onclick = (e) => {
                    if(e.target === container) handleContainerClick();
                };

                // pointer-events:none + tabindex="-1" stop this iframe from ever
                // grabbing keyboard focus. Without this, clicking/interacting with
                // the embedded ok.ru player hands your arrow-key presses to THEIR
                // page instead of yours, which they use for volume instead of scroll.
                const mediaElement = isIframe
                    ? `<iframe id="video-${i}" src="" frameborder="0" allow="autoplay; fullscreen" allowfullscreen tabindex="-1" style="width:100%;height:100%;pointer-events:none;"></iframe>`
                    : `<video id="video-${i}" playsinline loop></video>`;

                // Fullscreen + mute controls don't work on cross-origin iframes
                // (browser security), so they're omitted for iframe-type channels.
                const fullscreenBtn = isIframe ? '' : `
                        <button class="sidebar-btn" onclick="toggleFullScreen(event, ${i})" title="Fullscreen" aria-label="Toggle fullscreen">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                            </svg>
                        </button>`;

                const muteBtn = isIframe ? '' : `
                        <button class="sidebar-btn mute-btn-icon" onclick="toggleMute(event)" title="Toggle Sound" aria-label="Toggle sound">
                            ${isMuted ? '🔇' : '🔊'}
                        </button>`;

                const installBtn = `
                        <button class="sidebar-btn" onclick="handleInstallClick(event)" title="Add to Home Screen" aria-label="Add to home screen">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/>
                            </svg>
                        </button>`;

                const unmuteOverlay = isIframe ? '' : `
                    <div class="status-overlay unmute-overlay" id="unmute-overlay-${i}" style="display: ${isMuted ? 'flex' : 'none'};">
                        <button class="unmute-btn" onclick="toggleMute(event)">Tap to Unmute</button>
                    </div>`;

                // Shown only when the user explicitly pauses the currently
                // active video (tap or spacebar) - not for background videos
                // paused automatically while scrolling.
                const pauseOverlay = isIframe ? '' : `
                    <div class="status-overlay pause-overlay" id="pause-${i}">
                        <svg viewBox="0 0 24 24" width="70" height="70" fill="rgba(255,255,255,0.9)">
                            <circle cx="12" cy="12" r="12" fill="rgba(0,0,0,0.45)"/>
                            <rect x="8" y="7" width="3" height="10" rx="1"/>
                            <rect x="13" y="7" width="3" height="10" rx="1"/>
                        </svg>
                    </div>`;

                container.innerHTML = `
                    ${mediaElement}
                    
                    <div class="ui-layer">
                        
                        <div class="top-ui">
                            <div class="live-badge">
                                Live <div class="live-dot"></div>
                                
                            </div>
                        </div>
                        <div class="bottom-ui">
                            <div class="channel-name">${channel.name}</div>
                            <div class="channel-category">${channel.category}</div>
                        </div>
                    </div>

                    <div class="right-sidebar">
                        <a href="${channel.website}" target="_blank" class="channel-logo-link" title="Visit Website" aria-label="Visit ${channel.name} website">
                            <img src="${channel.logo}" alt="${channel.name} Logo" class="channel-logo" />
                        </a>

                        ${fullscreenBtn}
                        
                        <button class="sidebar-btn share-btn" onclick="shareChannel(event, ${i})" title="Share" aria-label="Share this channel">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <path d="M20.16 11.23l-7.5-6a1.5 1.5 0 00-2.43 1.17v3c-4.48.33-8.23 4.14-8.23 9.6 0 1.25.32 2.45.86 3.5a.5.5 0 00.86-.45c-.86-3.8.46-6.66 3.32-8.08 1.48-.74 3.03-1 4.54-1.11v3.42a1.5 1.5 0 002.43 1.17l7.5-6a1.5 1.5 0 000-2.34z" />
                            </svg>
                        </button>

                        ${muteBtn}
                        ${installBtn}
                    </div>

                    <div class="status-overlay" id="loading-${i}">
                        <div class="spinner"></div>
                    </div>

                    <div class="status-overlay" id="error-${i}">
                        <div class="error-message">Stream Unavailable<br><small>Skipping...</small></div>
                    </div>

                    ${unmuteOverlay}
                    ${pauseOverlay}
                `;
                appContainer.appendChild(container);
            }
        }

        function toggleFullScreen(event, index) {
            if (event) event.stopPropagation();
            const video = document.getElementById(`video-${index}`);
            if (!video || video.tagName === 'IFRAME') return; // not supported cross-origin
            
            if (!document.fullscreenElement) {
                if (video.requestFullscreen) {
                    video.requestFullscreen();
                } else if (video.webkitRequestFullscreen) { /* Safari */
                    video.webkitRequestFullscreen();
                } else if (video.msRequestFullscreen) { /* IE11 */
                    video.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function updatePlayers() {
            for (let i = 0; i < TOTAL_RENDER_COUNT; i++) {
                const channel = uniqueChannels[i % uniqueChannels.length];
                const distance = Math.abs(i - currentIndex);

                if (channel.type === 'iframe') {
                    // Iframes autoplay with sound the instant their src is set and
                    // can't be muted/paused cross-origin, so only ever load the
                    // exact channel on screen - never preload it as a neighbor.
                    if (i === currentIndex) {
                        loadVideo(i);
                    } else {
                        unloadVideo(i);
                    }
                    continue;
                }

                if (distance <= 1) {
                    loadVideo(i); 
                } else if (hlsInstances.has(i) || (document.getElementById(`video-${i}`) && document.getElementById(`video-${i}`).hasAttribute('src'))) {
                    unloadVideo(i); 
                }
            }

            for (let i = Math.max(0, currentIndex - 1); i <= Math.min(TOTAL_RENDER_COUNT - 1, currentIndex + 1); i++) {
                const video = document.getElementById(`video-${i}`);
                if (!video) continue;
                if (video.tagName === 'IFRAME') continue; // iframe handles its own playback via autoplay=1

                if (i === currentIndex) {
                    attemptAutoplay(video, i);
                } else {
                    video.pause();
                }
            }
        }

        function loadVideo(index) {
            const video = document.getElementById(`video-${index}`);
            const channel = uniqueChannels[index % uniqueChannels.length]; 
            const loadingUI = document.getElementById(`loading-${index}`);
            const errorUI = document.getElementById(`error-${index}`);

            if (channel.type === 'iframe') {
                errorUI.style.display = 'none';
                loadingUI.style.display = 'none'; // can't detect real load state cross-origin
                if (video.getAttribute('src')) return; // already loaded, don't re-trigger
                video.src = channel.url;
                return;
            }

            // Already loading/loaded via hls.js - don't touch the UI again,
            // this is what was causing the spinner to reappear on channels
            // you'd already watched.
            if (hlsInstances.has(index)) return;

            // Native HLS (Safari) - same guard, keyed off the src attribute instead.
            if (!Hls.isSupported() && video.getAttribute('src')) return;

            errorUI.style.display = 'none';
            loadingUI.style.display = 'flex';

            if (Hls.isSupported()) {
                const hls = new Hls({ maxBufferLength: 30, maxMaxBufferLength: 60, enableWorker: true });
                hls.loadSource(channel.url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    loadingUI.style.display = 'none';
                    if (index === currentIndex) {
                        attemptAutoplay(video, index);
                    }
                });
                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
                        else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
                        else handleFatalError(index, hls);
                    }
                });
                hlsInstances.set(index, hls);
            } 
            else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = channel.url;
                video.addEventListener('loadedmetadata', () => {
                    loadingUI.style.display = 'none';
                    if (index === currentIndex) {
                        attemptAutoplay(video, index);
                    }
                });
                video.addEventListener('error', () => handleFatalError(index, null));
            }
        }

        function unloadVideo(index) {
            const hls = hlsInstances.get(index);
            const video = document.getElementById(`video-${index}`);
            if (hls) { hls.destroy(); hlsInstances.delete(index); }
            if (video) {
                if (video.tagName === 'IFRAME') {
                    video.src = '';
                } else {
                    video.removeAttribute('src');
                    video.load();
                }
            }
        }

        function handleFatalError(index, hlsInstance) {
            if (hlsInstance) { hlsInstance.destroy(); hlsInstances.delete(index); }
            document.getElementById(`loading-${index}`).style.display = 'none';
            document.getElementById(`error-${index}`).style.display = 'flex';
            if (index === currentIndex) {
                setTimeout(() => { if (index === currentIndex) scrollToIndex(index + 1); }, 3000);
            }
        }

        function setupObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const newIndex = parseInt(entry.target.id.split('-')[1]);
                        if (currentIndex !== newIndex) {
                            const oldPauseIcon = document.getElementById(`pause-${currentIndex}`);
                            if (oldPauseIcon) oldPauseIcon.style.display = 'none';
                            currentIndex = newIndex;
                            updatePlayers();
                            dismissSwipeHint();
                        }
                    }
                });
            }, { root: appContainer, rootMargin: '0px', threshold: 0.6 });
            document.querySelectorAll('.channel-container').forEach(container => observer.observe(container));
        }

        function showSwipeHintIfNeeded() {
            if (localStorage.getItem('zinditok_seen_hint')) return;
            const hint = document.getElementById('swipe-hint');
            if (hint) hint.style.display = 'flex';
        }

        function dismissSwipeHint() {
            if (localStorage.getItem('zinditok_seen_hint')) return;
            localStorage.setItem('zinditok_seen_hint', 'true');
            const hint = document.getElementById('swipe-hint');
            if (hint) hint.style.display = 'none';
        }

        function scrollToIndex(index) {
            if (index < 0 || index >= TOTAL_RENDER_COUNT) return;
            document.getElementById(`container-${index}`).scrollIntoView({ behavior: 'smooth' });
        }

        function updateMuteUI() {
            document.querySelectorAll('.mute-btn-icon').forEach(icon => {
                icon.innerHTML = isMuted ? '🔇' : '🔊';
            });
            document.querySelectorAll('.unmute-overlay').forEach(overlay => {
                overlay.style.display = isMuted ? 'flex' : 'none';
            });
        }

        function toggleMute(event) {
            if (event) event.stopPropagation();
            isMuted = !isMuted;
            localStorage.setItem('zinditok_muted', isMuted);
            const activeVideo = document.getElementById(`video-${currentIndex}`);
            if (activeVideo && activeVideo.tagName !== 'IFRAME') {
                activeVideo.muted = isMuted;
                activeVideo.volume = 1.0;
            }
            updateMuteUI();
        }

        function handleContainerClick() {
            const video = document.getElementById(`video-${currentIndex}`);
            if (!video || video.tagName === 'IFRAME') return;
            const pauseIcon = document.getElementById(`pause-${currentIndex}`);
            if (video.paused) {
                video.play().catch(err => console.log("Play blocked:", err));
                if (pauseIcon) pauseIcon.style.display = 'none';
            } else {
                video.pause();
                if (pauseIcon) pauseIcon.style.display = 'flex';
            }
        }

        function shareChannel(event, index) {
            if (event) event.stopPropagation();
            const channel = uniqueChannels[index % uniqueChannels.length];
            const baseUrl = window.location.href.split('?')[0];
            const shareUrl = `${baseUrl}?channel=${channel.id}`;
            const shareData = {
                title: `Watch ${channel.name} Live`,
                text: `Check out ${channel.name} streaming live!`,
                url: shareUrl
            };
            if (navigator.share) {
                navigator.share(shareData).catch((err) => console.log('Share error:', err));
            } else {
                navigator.clipboard.writeText(`${shareData.title} - ${shareData.url}`).then(() => {
                    alert("Link copied to clipboard!");
                });
            }
        }

        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowUp': e.preventDefault(); scrollToIndex(currentIndex - 1); break;
                case 'ArrowDown': e.preventDefault(); scrollToIndex(currentIndex + 1); break;
                case ' ': e.preventDefault(); handleContainerClick(); break;
                case 'm': case 'M': toggleMute(); break;
                case 'f': case 'F': toggleFullScreen(null, currentIndex); break;
            }
        });

        initDOM();
        document.getElementById(`container-${currentIndex}`).scrollIntoView();
        setTimeout(() => { appContainer.style.scrollBehavior = 'smooth'; }, 100);
        setupObserver();
        updatePlayers();
        showSwipeHintIfNeeded();

    </script>
</body>
</html>
